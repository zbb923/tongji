<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>饭团摊 · 营业额统计</title>
<!-- 优先使用本地 ECharts，下载失败时回退到 CDN -->
<script src="/static/echarts.min.js"></script>
<script>window.echarts || document.write('<script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.5.1/echarts.min.js"><\/script>');</script>
<style>
:root{
  --bg:#f6f1e8;
  --card:#ffffff;
  --ink:#3b332a;
  --ink2:#93877a;
  --accent:#e07b39;
  --accent-dark:#c96524;
  --green:#4a9d6f;
  --red:#d94352;
  --line:#eee5d8;
  --radius:16px;
  --shadow:0 2px 12px rgba(90,70,40,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  padding:28px 16px 70px;
}
.wrap{max-width:960px;margin:0 auto}

/* 页头 */
.site-header{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.logo{
  width:46px;height:46px;border-radius:13px;flex:none;
  background:linear-gradient(135deg,#f2c94c,#e07b39);
  color:#fff;font-weight:bold;font-size:15px;letter-spacing:1px;
  display:flex;align-items:center;justify-content:center;
}
.site-header h1{font-size:22px}
.site-header .sub{color:var(--ink2);font-size:13px;margin-top:4px}

/* 卡片 */
.card{
  background:var(--card);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:20px;margin-bottom:18px;
}
.card-title{
  font-size:15px;margin:0 0 14px;display:flex;align-items:center;gap:8px;
}
.card-title::before{content:'';width:4px;height:16px;border-radius:2px;background:var(--accent)}
.chart-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.chart-head .card-title{margin:0}

/* 录入表单 */
.form-row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:6px}
.field span{font-size:13px;color:var(--ink2)}
.field input{
  padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  font-size:15px;width:180px;background:#fdfbf7;color:var(--ink);outline:none;
}
.field input:focus{border-color:var(--accent)}
.btn{
  background:var(--accent);color:#fff;border:none;border-radius:10px;
  padding:11px 30px;font-size:15px;cursor:pointer;
}
.btn:hover{background:var(--accent-dark)}
.hint{font-size:12px;color:var(--ink2);margin-top:10px}

/* 日期快捷切换 & 休息日 */
.date-nav{display:flex;gap:6px;align-items:stretch}
.nav-btn{
  width:36px;border:1px solid var(--line);border-radius:10px;
  background:#fdfbf7;color:var(--ink2);font-size:20px;cursor:pointer;
}
.nav-btn:hover{border-color:var(--accent);color:var(--accent-dark)}
.rest-toggle{
  display:flex;align-items:center;gap:8px;height:42px;padding:0 16px;margin-bottom:1px;
  border:1px solid var(--line);border-radius:10px;background:#fdfbf7;
  font-size:14px;color:var(--ink2);cursor:pointer;user-select:none;white-space:nowrap;
}
.rest-toggle input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;margin:0}
.rest-toggle.on{border-color:var(--accent);color:var(--accent-dark);background:#fdf6ee}
.field input:disabled{background:#f1e9dc;color:var(--ink2);cursor:not-allowed}
.link-today{color:var(--accent-dark);cursor:pointer}
.link-today:hover{text-decoration:underline}
.rest-badge{background:#f1e9dc;color:#b9ab99;font-size:12px;padding:2px 10px;border-radius:6px}
tr.rest-row td{color:#b9ab99}
tr.rest-row .wk-badge{opacity:.55}

/* 统计卡片 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px;margin-bottom:18px}
.stat{
  background:var(--card);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:16px 18px;
}
.stat-label{font-size:13px;color:var(--ink2)}
.stat-value{font-size:24px;font-weight:700;margin-top:6px;line-height:1.2}
.stat-value small{font-size:13px;font-weight:400;color:var(--ink2);margin-left:2px}
.stat-sub{font-size:12px;color:var(--ink2);margin-top:4px}
.stat-accent{background:linear-gradient(135deg,#e07b39,#e89a55);color:#fff}
.stat-accent .stat-label,.stat-accent .stat-sub{color:rgba(255,255,255,.85)}
.stat-accent .stat-value small{color:rgba(255,255,255,.85)}

/* 图表切换标签 */
.tabs{display:flex;background:#f1e9dc;border-radius:10px;padding:3px}
.tab{
  border:none;background:transparent;padding:7px 16px;border-radius:8px;
  font-size:13px;color:var(--ink2);cursor:pointer;
}
.tab.active{
  background:#fff;color:var(--accent-dark);font-weight:600;
  box-shadow:0 1px 4px rgba(0,0,0,.08);
}
#chart{height:380px;width:100%}

/* 历史记录表格 */
table{width:100%;border-collapse:collapse;font-size:14px}
th{
  text-align:left;color:var(--ink2);font-weight:500;font-size:13px;
  padding:8px 10px;border-bottom:1px solid var(--line);
}
td{padding:9px 10px;border-bottom:1px solid #f5efe6}
tr:last-child td{border-bottom:none}
th.amt,td.amt{text-align:right;font-weight:600}
td.op{text-align:right}
.wk-badge{
  background:#fdeaea;color:#c03540;font-size:12px;
  padding:2px 8px;border-radius:6px;
}
.del{
  border:none;background:none;color:#b9ab99;cursor:pointer;
  font-size:13px;padding:4px 8px;border-radius:6px;
}
.del:hover{background:#fdeaea;color:#c03540}
.empty{text-align:center;color:var(--ink2);font-size:14px;padding:24px 0;display:none}

/* AI 智能分析 */
#btn-ai{padding:9px 22px;font-size:13px}
#btn-ai:disabled{background:#d8c9b6;cursor:not-allowed}
.ai-result{margin-top:14px;min-height:60px}
.ai-placeholder{
  color:var(--ink2);font-size:13px;text-align:center;padding:26px 0;
  background:#faf6ee;border-radius:12px;border:1px dashed #e3d8c6;
}
.ai-loading{
  display:flex;align-items:center;justify-content:center;gap:10px;
  color:var(--ink2);font-size:14px;padding:26px 0;
}
.spinner{
  width:18px;height:18px;border:3px solid #eee0cc;border-top-color:var(--accent);
  border-radius:50%;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-result .md-h{font-size:14px;font-weight:700;margin:16px 0 6px}
.ai-result p{font-size:14px;line-height:1.9;margin:8px 0;color:#5a5145}
.ai-result ul{margin:6px 0;padding-left:22px}
.ai-result li{font-size:14px;line-height:1.9;color:#5a5145;margin:4px 0}
.ai-result strong{color:var(--accent-dark)}
.ai-error{background:#fdeaea;color:#c03540;font-size:13px;padding:12px 16px;border-radius:10px}

/* 提示气泡 */
#toast{
  position:fixed;left:50%;top:24px;z-index:99;
  transform:translateX(-50%) translateY(-80px);
  background:#3b332a;color:#fff;padding:10px 22px;border-radius:10px;
  font-size:14px;opacity:0;transition:.3s;pointer-events:none;
}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* 手机适配 */
@media(max-width:640px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .form-row{gap:10px}
  .field{flex:1;min-width:130px}
  .field input{width:100%}
  .date-nav input{width:auto;flex:1;min-width:0}
  .form-row .btn{width:100%;padding:11px 0}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="site-header">
    <div class="logo">饭团</div>
    <div>
      <h1>饭团摊营业额统计</h1>
      <p class="sub">记录每天营业额，看看星期几生意最好</p>
    </div>
  </header>

  <!-- 录入营业额 -->
  <section class="card">
    <h2 class="card-title">录入营业额</h2>
    <div class="form-row">
      <div class="field">
        <span>日期</span>
        <div class="date-nav">
          <button type="button" class="nav-btn" id="btn-prev" title="上一天">‹</button>
          <input type="date" id="input-date">
          <button type="button" class="nav-btn" id="btn-next" title="下一天">›</button>
        </div>
      </div>
      <label class="field">
        <span>营业额（元）</span>
        <input type="number" id="input-amount" step="0.01" min="0" placeholder="如 358.5">
      </label>
      <label class="rest-toggle" id="rest-toggle">
        <input type="checkbox" id="input-rest">休息日
      </label>
      <button class="btn" id="btn-save">保存</button>
    </div>
    <p class="hint">同一天重复保存会覆盖；切换日期自动带出已有记录；<span class="link-today" id="link-today">回到今天</span></p>
  </section>

  <!-- 概览统计 -->
  <section class="stats">
    <div class="stat">
      <div class="stat-label">累计营业额</div>
      <div class="stat-value" id="stat-total">--</div>
      <div class="stat-sub" id="stat-total-sub"></div>
    </div>
    <div class="stat">
      <div class="stat-label">平均每次出摊</div>
      <div class="stat-value" id="stat-avg">--</div>
      <div class="stat-sub" id="stat-avg-sub"></div>
    </div>
    <div class="stat">
      <div class="stat-label">单日最高</div>
      <div class="stat-value" id="stat-max">--</div>
      <div class="stat-sub" id="stat-max-sub"></div>
    </div>
    <div class="stat">
      <div class="stat-label">出勤率</div>
      <div class="stat-value" id="stat-att">--</div>
      <div class="stat-sub" id="stat-att-sub"></div>
    </div>
    <div class="stat stat-accent">
      <div class="stat-label">最旺星期</div>
      <div class="stat-value" id="stat-best">--</div>
      <div class="stat-sub" id="stat-best-sub"></div>
    </div>
  </section>

  <!-- 折线图 -->
  <section class="card">
    <div class="chart-head">
      <h2 class="card-title">营业额折线图</h2>
      <div class="tabs">
        <button class="tab active" data-mode="date">按日期走势</button>
        <button class="tab" data-mode="weekday">按星期分析</button>
      </div>
    </div>
    <div id="chart"></div>
    <p class="hint" id="chart-hint"></p>
  </section>

  <!-- AI 智能分析 -->
  <section class="card">
    <div class="chart-head">
      <h2 class="card-title">AI 智能分析</h2>
      <button class="btn" id="btn-ai">开始分析</button>
    </div>
    <p class="hint" style="margin-top:0">由 DeepSeek 结合当前所有数据，分析营业额与日期、星期之间的关系，约需 10-30 秒</p>
    <div id="ai-result" class="ai-result">
      <p class="ai-placeholder">点击"开始分析"，AI 会给出走势解读、最旺最淡的星期和实用建议</p>
    </div>
  </section>

  <!-- 历史记录 -->
  <section class="card">
    <h2 class="card-title">历史记录</h2>
    <table>
      <thead>
        <tr><th>日期</th><th>星期</th><th class="amt">营业额（元）</th><th></th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <p class="empty" id="empty-tip">还没有记录，先在上方录入今天卖了多少吧</p>
  </section>

</div>
<div id="toast"></div>

<script>
/* ================= 基础配置 ================= */
var WEEK_NAMES = ['周一','周二','周三','周四','周五','周六','周日'];
var COLOR_MAIN = '#e07b39';   // 主题橙：按日期折线
var COLOR_WEEK = '#4a9d6f';   // 辅助绿：按星期折线
var COLOR_RED  = '#d94352';   // 周末高亮红

var records = [];      // 全部记录 [{id, date, amount, is_rest}]，按日期升序
var days = [];         // 补全后的连续日期序列（无记录的日期默认休息），用于图表和统计
var chartMode = 'date';// 当前图表模式：date=按日期 / weekday=按星期
var chart = echarts.init(document.getElementById('chart'));
window.addEventListener('resize', function(){ chart.resize(); });

/* ================= 工具函数 ================= */
// 返回 0~6，0=周一 ... 6=周日
function weekdayIndex(dateStr){
  var d = new Date(dateStr + 'T00:00:00').getDay(); // 0=周日
  return d === 0 ? 6 : d - 1;
}
// 金额格式化：最多保留 2 位小数并加千分位
function fmt(n){
  return parseFloat(Number(n).toFixed(2)).toLocaleString('zh-CN');
}
// 顶部提示气泡
var toastTimer = null;
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

/* ================= 数据读写 ================= */
// 生成连续日期序列：从第一条记录到今天；没有记录的日期默认视为休息日。
// 今天没有记录则不显示今天（等你录入了才出现）
function buildDays(){
  if(!records.length) return [];
  var map = {};
  records.forEach(function(r){ map[r.date] = r; });
  function key(d){
    return d.getFullYear() + '-'
      + String(d.getMonth() + 1).padStart(2, '0') + '-'
      + String(d.getDate()).padStart(2, '0');
  }
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var todayKey = key(today);
  var out = [];
  var cur = new Date(records[0].date + 'T00:00:00');
  while(cur <= today){
    var k = key(cur);
    if(map[k]){
      out.push(map[k]);
    } else if(k !== todayKey){
      out.push({date: k, amount: 0, is_rest: 1}); // 默认休息日（未入库）
    }
    cur.setDate(cur.getDate() + 1);
  }
  return out;
}

function loadRecords(){
  fetch('/api/records')
    .then(function(res){ return res.json(); })
    .then(function(data){
      records = data.records || [];
      days = buildDays();
      renderStats();
      renderChart();
      renderTable();
      prefillFromRecord();
    })
    .catch(function(){ toast('加载失败，请确认服务正在运行'); });
}

// 休息日开关：勾选后禁用金额输入
function syncRestUI(){
  var on = document.getElementById('input-rest').checked;
  var amountEl = document.getElementById('input-amount');
  amountEl.disabled = on;
  if(on) amountEl.value = '';
  document.getElementById('rest-toggle').classList.toggle('on', on);
}

// 根据当前选中日期，把已有记录带回表单（方便修改/补录）
function findRecord(date){
  for(var i = 0; i < records.length; i++){
    if(records[i].date === date) return records[i];
  }
  return null;
}
function prefillFromRecord(){
  var r = findRecord(document.getElementById('input-date').value);
  var amountEl = document.getElementById('input-amount');
  var restEl = document.getElementById('input-rest');
  if(r && r.is_rest){
    restEl.checked = true;
    amountEl.value = '';
  } else {
    restEl.checked = false;
    amountEl.value = r ? r.amount : '';
  }
  syncRestUI();
}

// 上一天 / 下一天
function shiftDate(days){
  var el = document.getElementById('input-date');
  if(!el.value) return;
  var d = new Date(el.value + 'T00:00:00');
  d.setDate(d.getDate() + days);
  el.value = d.getFullYear() + '-'
    + String(d.getMonth() + 1).padStart(2, '0') + '-'
    + String(d.getDate()).padStart(2, '0');
  prefillFromRecord();
}

function saveRecord(){
  var date = document.getElementById('input-date').value;
  var rest = document.getElementById('input-rest').checked;
  var amount = document.getElementById('input-amount').value;
  if(!date){ toast('请选择日期'); return; }
  var body = {date: date};
  if(rest){
    body.is_rest = 1;              // 休息日：不记金额
  } else {
    if(amount === '' || isNaN(Number(amount)) || Number(amount) < 0){
      toast('请输入正确的金额，或勾选"休息日"'); return;
    }
    body.amount = Number(amount);
  }
  fetch('/api/records', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  })
    .then(function(res){ return res.json(); })
    .then(function(data){
      if(!data.ok){ toast(data.msg || '保存失败'); return; }
      toast(body.is_rest ? '已记录为休息日' : '已保存');
      loadRecords();
    })
    .catch(function(){ toast('保存失败'); });
}

function deleteRecord(id, date){
  if(!confirm('确定删除 ' + date + ' 的记录吗？')) return;
  fetch('/api/records/' + id, {method: 'DELETE'})
    .then(function(){ loadRecords(); });
}

/* ================= 概览统计 ================= */
function renderStats(){
  var ids   = ['stat-total','stat-avg','stat-max','stat-best','stat-att'];
  var subIds= ['stat-total-sub','stat-avg-sub','stat-max-sub','stat-best-sub','stat-att-sub'];
  if(!days.length){
    ids.forEach(function(id){ document.getElementById(id).textContent = '--'; });
    subIds.forEach(function(id){ document.getElementById(id).textContent = ''; });
    return;
  }
  // 只统计真实出摊日；无记录的日期已按默认休息补进 days
  var stall = days.filter(function(r){ return !r.is_rest; });
  var restCnt = days.length - stall.length;
  var total = 0, maxRec = null;
  stall.forEach(function(r){
    total += r.amount;
    if(!maxRec || r.amount > maxRec.amount) maxRec = r;
  });

  if(stall.length){
    document.getElementById('stat-total').innerHTML = fmt(total) + '<small>元</small>';
    document.getElementById('stat-total-sub').textContent =
      '出摊 ' + stall.length + ' 天 · 休息 ' + restCnt + ' 天';
    var avg = total / stall.length;
    document.getElementById('stat-avg').innerHTML = fmt(avg) + '<small>元</small>';
    document.getElementById('stat-avg-sub').textContent = '仅按出摊日计算';
    document.getElementById('stat-max').innerHTML = fmt(maxRec.amount) + '<small>元</small>';
    document.getElementById('stat-max-sub').textContent =
      maxRec.date + ' ' + WEEK_NAMES[weekdayIndex(maxRec.date)];
  } else {
    ['stat-total','stat-avg','stat-max'].forEach(function(id){
      document.getElementById(id).textContent = '--';
    });
    document.getElementById('stat-total-sub').textContent = '全部是休息日';
    document.getElementById('stat-avg-sub').textContent = '';
    document.getElementById('stat-max-sub').textContent = '';
  }

  // 出勤率 = 出摊天数 / 统计范围内的日历天数
  var att = Math.round(stall.length / days.length * 100);
  document.getElementById('stat-att').innerHTML = att + '<small>%</small>';
  document.getElementById('stat-att-sub').textContent = '统计范围 ' + days.length + ' 天';

  // 按星期分组求平均（仅出摊日），找出最旺的星期
  var groups = [[],[],[],[],[],[],[]];
  stall.forEach(function(r){ groups[weekdayIndex(r.date)].push(r.amount); });
  var bestIdx = -1, bestAvg = -1;
  groups.forEach(function(g, i){
    if(!g.length) return;
    var a = g.reduce(function(s, v){ return s + v; }, 0) / g.length;
    if(a > bestAvg){ bestAvg = a; bestIdx = i; }
  });
  document.getElementById('stat-best').textContent = bestIdx >= 0 ? WEEK_NAMES[bestIdx] : '--';
  document.getElementById('stat-best-sub').textContent =
    bestIdx >= 0 ? '平均 ' + fmt(bestAvg) + ' 元 / 次' : '';
}

/* ================= 折线图 ================= */
function renderChart(){
  var hint = document.getElementById('chart-hint');
  if(!records.length){
    hint.textContent = '';
    chart.clear();
    chart.setOption({
      graphic: {elements: [{
        type: 'text', left: 'center', top: 'middle',
        style: {text: '暂无数据，先录入营业额吧', fill: '#b5a99a', font: '16px "Microsoft YaHei"'}
      }]}
    });
    return;
  }
  hint.textContent = chartMode === 'date'
    ? '日期连续显示，无记录的日期默认休息（灰点 0 元）；红点为周末；虚线为出摊日平均'
    : '折线为各星期几的平均营业额（仅出摊日）；鼠标悬停可查看出摊天数与最高最低';
  chart.setOption(chartMode === 'date' ? buildDateOption() : buildWeekdayOption(), true);
}

// 模式一：按日期走势（日期连续，无记录的日期默认休息）
function buildDateOption(){
  var stall = days.filter(function(r){ return !r.is_rest; });
  var total = stall.reduce(function(s, r){ return s + r.amount; }, 0);
  var avg = stall.length ? total / stall.length : 0;
  // 休息日集合，用于 x 轴打"休"标记
  var restMap = {};
  days.forEach(function(r){ if(r.is_rest) restMap[r.date] = 1; });

  var xData = days.map(function(r){ return r.date; });
  // 休息日按 0 元连线（灰色点）；周末的数据点标红
  var seriesData = days.map(function(r){
    if(r.is_rest){
      return {value: 0, itemStyle: {color: '#b9ab99'}};
    }
    if(weekdayIndex(r.date) >= 5){
      return {value: r.amount, itemStyle: {color: COLOR_RED}};
    }
    return r.amount;
  });

  return {
    grid: {left: 56, right: 24, top: 36, bottom: 56},
    tooltip: {
      trigger: 'axis',
      backgroundColor: '#fff', borderColor: '#eee5d8',
      textStyle: {color: '#3b332a'},
      formatter: function(params){
        var r = days[params[0].dataIndex];
        if(r.is_rest) return r.date + ' ' + WEEK_NAMES[weekdayIndex(r.date)] + '<br/>休息，未出摊';
        return r.date + ' ' + WEEK_NAMES[weekdayIndex(r.date)]
          + '<br/>营业额：<b>' + fmt(r.amount) + '</b> 元';
      }
    },
    xAxis: {
      type: 'category',
      data: xData,
      boundaryGap: false,
      axisLine: {lineStyle: {color: '#d8cbb8'}},
      axisTick: {show: false},
      axisLabel: {
        color: '#93877a', lineHeight: 16,
        // 标签显示 "09-08" + 换行 + 星期；休息日显示灰色"休"
        formatter: function(v){
          return v.slice(5) + '\n' + (restMap[v] ? '{rk|休}' : '{a|' + WEEK_NAMES[weekdayIndex(v)] + '}');
        },
        rich: {
          a: {color: '#93877a', lineHeight: 16},
          rk: {color: '#b9ab99', backgroundColor: '#f1e9dc', padding: [1, 6], borderRadius: 4, lineHeight: 16}
        }
      }
    },
    yAxis: {
      type: 'value', scale: true, name: '元',
      nameTextStyle: {color: '#93877a'},
      axisLabel: {color: '#93877a'},
      splitLine: {lineStyle: {color: '#f0e8db'}}
    },
    series: [{
      type: 'line',
      smooth: true,
      symbol: 'circle',
      symbolSize: 9,
      color: COLOR_MAIN,
      lineStyle: {width: 3},
      data: seriesData,
      areaStyle: {
        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
          {offset: 0, color: 'rgba(224,123,57,0.22)'},
          {offset: 1, color: 'rgba(224,123,57,0.02)'}
        ])
      },
      // 平均值虚线
      markLine: {
        silent: true,
        symbol: 'none',
        lineStyle: {type: 'dashed', color: '#b0a494'},
        label: {formatter: '平均 ' + fmt(avg), position: 'insideEndTop', color: '#93877a'},
        data: [{yAxis: avg}]
      }
    }]
  };
}

// 模式二：按星期分析（各星期几的平均营业额，仅出摊日）
function buildWeekdayOption(){
  // 按星期分组：0=周一 ... 6=周日；休息日单独计数（含默认休息日）
  var groups = [[],[],[],[],[],[],[]];
  var restCnt = [0,0,0,0,0,0,0];
  days.forEach(function(r){
    var i = weekdayIndex(r.date);
    if(r.is_rest) restCnt[i]++;
    else groups[i].push(r.amount);
  });

  var avgData = groups.map(function(g){
    if(!g.length) return null; // 没出摊过的星期不画点
    return Math.round(g.reduce(function(s, v){ return s + v; }, 0) / g.length * 100) / 100;
  });

  return {
    grid: {left: 56, right: 24, top: 36, bottom: 34},
    tooltip: {
      trigger: 'axis',
      backgroundColor: '#fff', borderColor: '#eee5d8',
      textStyle: {color: '#3b332a'},
      formatter: function(params){
        var p = params[0];
        var g = groups[p.dataIndex];
        var rc = restCnt[p.dataIndex];
        if(!g.length && !rc) return p.name + '<br/>暂无记录';
        if(!g.length) return p.name + '（休息 ' + rc + ' 天）<br/>暂无出摊记录';
        var mx = Math.max.apply(null, g);
        var mn = Math.min.apply(null, g);
        return p.name + '（出摊 ' + g.length + ' 天' + (rc ? ' · 休息 ' + rc + ' 天' : '') + '）'
          + '<br/>平均：<b>' + fmt(p.value) + '</b> 元'
          + '<br/>最高 ' + fmt(mx) + ' 元 / 最低 ' + fmt(mn) + ' 元';
      }
    },
    xAxis: {
      type: 'category',
      data: WEEK_NAMES,
      axisLine: {lineStyle: {color: '#d8cbb8'}},
      axisTick: {show: false},
      axisLabel: {
        color: '#3b332a', fontSize: 13,
        // 周六周日标红
        formatter: function(v){
          return (v === '周六' || v === '周日') ? '{wk|' + v + '}' : v;
        },
        rich: {wk: {color: COLOR_RED, fontWeight: 'bold', fontSize: 13}}
      }
    },
    yAxis: {
      type: 'value', scale: true, name: '元',
      nameTextStyle: {color: '#93877a'},
      axisLabel: {color: '#93877a'},
      splitLine: {lineStyle: {color: '#f0e8db'}}
    },
    series: [{
      type: 'line',
      smooth: true,
      symbol: 'circle',
      symbolSize: 11,
      color: COLOR_WEEK,
      lineStyle: {width: 3},
      connectNulls: false,
      data: avgData,
      // 每个点上方显示平均值
      label: {
        show: true, color: '#4a9d6f', fontWeight: 'bold',
        formatter: function(p){ return p.value == null ? '' : fmt(p.value); }
      },
      areaStyle: {
        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
          {offset: 0, color: 'rgba(74,157,111,0.18)'},
          {offset: 1, color: 'rgba(74,157,111,0.02)'}
        ])
      }
    }]
  };
}

/* ================= 历史记录表格 ================= */
function renderTable(){
  var tbody = document.getElementById('tbody');
  var emptyTip = document.getElementById('empty-tip');
  tbody.innerHTML = '';
  if(!records.length){
    emptyTip.style.display = 'block';
    return;
  }
  emptyTip.style.display = 'none';

  records.slice().reverse().forEach(function(r){
    var wk = weekdayIndex(r.date);
    var tr = document.createElement('tr');
    if(r.is_rest) tr.className = 'rest-row';
    tr.innerHTML =
      '<td>' + r.date + '</td>' +
      '<td>' + (wk >= 5
        ? '<span class="wk-badge">' + WEEK_NAMES[wk] + '</span>'
        : WEEK_NAMES[wk]) + '</td>' +
      '<td class="amt">' + (r.is_rest ? '<span class="rest-badge">休</span>' : fmt(r.amount)) + '</td>' +
      '<td class="op"><button class="del" data-id="' + r.id + '" data-date="' + r.date + '">删除</button></td>';
    tbody.appendChild(tr);
  });
}

/* ================= AI 智能分析 ================= */
// 轻量 markdown 渲染：支持标题、加粗、无序/有序列表、段落
function renderMd(text){
  var html = '', inList = false;
  function esc(s){
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function inline(s){
    return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  }
  text.split('\n').forEach(function(raw){
    var line = raw.trim();
    if(!line){
      if(inList){ html += '</ul>'; inList = false; }
      return;
    }
    // 列表项（- xxx / * xxx / 1. xxx）
    if(/^([-*]|\d+\.)\s+/.test(line)){
      if(!inList){ html += '<ul>'; inList = true; }
      html += '<li>' + inline(line.replace(/^([-*]|\d+\.)\s+/, '')) + '</li>';
      return;
    }
    if(inList){ html += '</ul>'; inList = false; }
    // 标题（# ~ ####）
    var h = line.match(/^#{1,4}\s+(.*)$/);
    if(h){
      html += '<div class="md-h">' + inline(h[1]) + '</div>';
    } else {
      html += '<p>' + inline(line) + '</p>';
    }
  });
  if(inList) html += '</ul>';
  return html;
}

var aiBusy = false;
function runAiAnalysis(){
  if(aiBusy) return;
  if(!records.length){ toast('还没有数据，先录入营业额'); return; }

  aiBusy = true;
  var btn = document.getElementById('btn-ai');
  var box = document.getElementById('ai-result');
  btn.disabled = true;
  btn.textContent = '分析中...';
  box.innerHTML =
    '<div class="ai-loading"><span class="spinner"></span>DeepSeek 正在分析，请稍等...</div>';

  fetch('/api/ai-analysis', {method: 'POST'})
    .then(function(res){ return res.json(); })
    .then(function(data){
      if(data.ok){
        box.innerHTML = renderMd(data.content);
      } else {
        box.innerHTML = '<p class="ai-error">' + (data.msg || '分析失败') + '</p>';
      }
    })
    .catch(function(){
      box.innerHTML = '<p class="ai-error">网络错误，请稍后重试</p>';
    })
    .finally(function(){
      aiBusy = false;
      btn.disabled = false;
      btn.textContent = '重新分析';
    });
}
